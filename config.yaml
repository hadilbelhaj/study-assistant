# Central application configuration.
# Change settings here instead of modifying application code.

embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  # Alternative:
  # model: "BAAI/bge-m3"

generation:
  provider: "ollama"
  model: "qwen2.5:7b"

chunking:
  chunk_size_tokens: 500
  chunk_overlap_pct: 0.15
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - "? "
    - "! "
    - " "

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  vectorstore_dir: "data/vectorstore"

retrieval:
  top_k: 5
  candidate_k: 20
  rrf_k: 60

  # Planned for a later retrieval-confidence step.
  # Do not use this yet until calibrated on your evaluation dataset.
  min_similarity_threshold: 0.35

reranker:
  model: "Qwen/Qwen3-Reranker-0.6B"