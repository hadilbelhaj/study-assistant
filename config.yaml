# Central application configuration.
# Change settings here instead of modifying application code.

embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  dimension: 1024
  # Alternative:
  # model: "BAAI/bge-m3"

generation:
  provider: "ollama"
  model: "qwen2.5:7b"

chunking:
  chunk_size_tokens: 500
  chunk_overlap_pct: 0.15
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - "? "
    - "! "
    - " "

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"

retrieval:
  top_k: 5
  candidate_k: 20

reranker:
  model: "Qwen/Qwen3-Reranker-0.6B"
qdrant:
  url: "http://localhost:6333"
  collection: "course_chunks"