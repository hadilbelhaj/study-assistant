[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-study-assistant"
version = "0.1.0"
description = "RAG Study Assistant project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client",
    "sentence-transformers",
    "redis>=5.0,<7.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "ollama>=0.4,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_study_assistant*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.setuptools.package-data]
rag_study_assistant = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
]