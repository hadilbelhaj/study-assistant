[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-study-assistant"
version = "0.1.0"
description = "RAG Study Assistant project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client",
    "sentence-transformers",
    "redis>=5.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
